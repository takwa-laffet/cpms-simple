<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CityOs Login</title>
    <meta
      name="description"
      content="CityOs login page for accessing the OCPP charge point dashboard."
    />
    <link rel="canonical" href="/login" />
    <link rel="stylesheet" href="/frontend/styles.css" />
    <script defer src="/frontend/app.js"></script>
  </head>
  <body>
    <div class="bg-orb bg-orb-a"></div>
    <div class="bg-orb bg-orb-b"></div>

    <section id="login-screen" class="login-screen shell">
      <div class="login-card">
        <div class="login-copy">
          <p class="eyebrow">CityOs</p>
          <h1>Sign in to CityOs</h1>
          <p class="lede">
            Access the CityOs platform by signing in first. The dashboard is available only after authentication.
          </p>
        </div>

        <form id="login-form" class="login-form" action="/api/auth/login?next=/cityos" method="post">
          <label>
            Email
            <input id="login-email" name="email" type="email" autocomplete="email" value="mvp@prelabel.tn" required />
          </label>
          <label>
            Password
            <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
          </label>
          <p id="login-error" class="login-error" aria-live="polite"></p>
          <button class="btn btn-primary login-submit" type="submit">Sign in</button>
          <p class="note login-note">Use the provided credentials to continue. After login, the dashboard opens on /cityos.</p>
        </form>
      </div>
    </section>
  </body>
</html>
